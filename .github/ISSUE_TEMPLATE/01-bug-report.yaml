name: 🐞 Сообщить об ошибке
description: Что-то работает не так в приложении для Windows
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время написать.

        Это трекер **графического клиента TrustTunnel для Windows** (издания Pro и Light).
        Ошибки в самом протоколе TrustTunnel и в консольном клиенте — в
        [TrustTunnel/TrustTunnelClient](https://github.com/TrustTunnel/TrustTunnelClient).

  - type: dropdown
    id: edition
    attributes:
      label: Какое издание
      options:
        - Pro
        - Light
        - Не знаю
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Версия приложения
      description: 'Открыть «О программе» — версия написана там. Если после номера стоит дефис и шесть символов (например `3.0.0-a3f9k2`), укажите целиком: это тестовая сборка.'
      placeholder: например 3.0.0
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Версия Windows
      options:
        - Windows 11
        - Windows 10
        - Другая
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Что вы делали
      description: По шагам, чтобы можно было повторить. Если ошибка появляется не всегда — напишите, как часто.
      placeholder: |
        1. Открыл вкладку «Подключение»
        2. Нажал «Подключить» на сервере
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что должно было произойти
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Что произошло на самом деле
      description: Если приложение показало сообщение об ошибке — приведите его текст целиком.
    validations:
      required: true

  - type: textarea
    id: other_vpn
    attributes:
      label: Другие VPN-программы на этом компьютере
      description: |
        Важно даже если они **выключены и не запущены**. Чужой сетевой драйвер, просто установленный
        в системе, умеет ломать подключение — такой случай уже разбирали (Radmin VPN).
        Перечислите всё, что стоит: Radmin VPN, WireGuard, OpenVPN, Amnezia, Hamachi и подобное.
      placeholder: 'например: стоит Radmin VPN, не запущен'
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Журнал работы
      description: |
        Сильно помогает. В приложении: «Настройки» → журнал → **«Показать в папке»**, нужен файл `app.log`.
        Папка же лежит по пути `%LOCALAPPDATA%\TrustTunnel Client Pro`.

        Паролей в этом файле нет — приложение не пишет их в журнал. Но адреса ваших серверов там
        есть: если не хотите показывать их публично, замените на `example.com` перед отправкой.
      placeholder: Приложите файл или вставьте последние строки.
    validations:
      required: false

  - type: textarea
    id: screens
    attributes:
      label: Снимки экрана
      description: Можно перетащить картинку прямо в это поле или вставить из буфера обмена.
      value: |
        <details><summary>Снимок экрана</summary>

        <!-- вставьте картинку сюда -->

        </details>
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Что ещё стоит знать
    validations:
      required: false
