name: 🚀 Предложить улучшение
description: Чего не хватает в приложении для Windows
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Это трекер **графического клиента TrustTunnel для Windows**. Предложения по самому протоколу
        TrustTunnel — в [TrustTunnel/TrustTunnelClient](https://github.com/TrustTunnel/TrustTunnelClient).

  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решит
      description: Опишите не саму доработку, а то, что сейчас неудобно или невозможно. Так понятнее, что именно чинить.
      placeholder: 'например: чтобы понять, какой сервер сейчас работает быстрее, приходится подключаться к каждому по очереди'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Как вы это видите
      placeholder: Что должно появиться в приложении и где.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Как вы обходитесь сейчас
      description: Если никак — так и напишите.
    validations:
      required: false
