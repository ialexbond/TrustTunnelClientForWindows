name: Frontend Quality

on:
  push:
    branches:
      # `**` not `*` — single-star does NOT match `/` in branch refs, so
      # pushes to `release/*` or `claude/*` would silently skip the gate
      # (this exact bug let TD-05 prerelease regression live undetected
      # until manually surfaced 2026-05-23).
      - "**"
    paths:
      # gui-light is parked until its dedicated redesign milestone (user
      # direction 2026-05-23); its paths are intentionally omitted from
      # the trigger so the now-out-of-scope edition can drift without
      # blocking gui-pro releases. Re-add when the redesign milestone
      # starts and the edition is rebuilt.
      - "gui-pro/src/**"
      - "gui-pro/package.json"
      - "gui-pro/package-lock.json"
      - "gui-pro/tsconfig.json"
      - "gui-pro/vite.config.ts"
      - "gui-pro/eslint.config.js"
      # The i18n coverage gate itself. Its rules decide which locale keys count
      # as reachable, so a change to it can flip the job's verdict without any
      # gui-pro/ file changing — it has to be able to trigger its own run.
      - "scripts/i18n-dead-keys.cjs"
      - "scripts/i18n-dead-keys.sh"
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  gui-pro:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'skipci:')"
    defaults:
      run:
        working-directory: gui-pro
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui-pro/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      # i18n coverage (T-42). Vitest's i18n.test.ts only proves ru.json and
      # en.json agree with each other — a key whose screen was deleted stays
      # green there forever, which is how 372 of 1728 leaves accumulated before
      # anything looked. This step is the thing that stops them coming back.
      - name: i18n dead-key gate
        run: npm run i18n:check

  # gui-light job removed 2026-05-23 — the Light edition is out of scope
  # until its dedicated redesign milestone. Last on-fork typecheck failed
  # with a Tooltip `position` prop drift in WindowControls.tsx that the
  # gui-pro Tooltip primitive no longer accepts. Re-add the job when the
  # Light redesign milestone starts and the edition's TS/lint debt is
  # cleaned up; reference: ln-622 audit finding (build), CONCERNS.md.
