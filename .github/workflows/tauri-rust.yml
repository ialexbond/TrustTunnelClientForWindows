name: Tauri Rust (gui-pro)

# Closes audit finding H-2 (ln-622 build, ln-624 quality): the existing
# `lint-rust.yml` only runs `cargo clippy` against the C++ setup_wizard
# crate. The Tauri Rust crate in `gui-pro/src-tauri/` — the bulk of the
# backend — had zero CI coverage. The only quality gate for it was the
# local `npm run prerelease` script, which itself regressed silently
# (TD-05) until manually fixed this session.
#
# This workflow runs the two Rust gates the audit identified as
# mandatory on every PR:
#   1. cargo clippy --no-deps --all-targets -- -D warnings
#      (--all-targets puts #[cfg(test)] code under clippy too — WIN-22-29 —
#      so this CI step and the local `npm run rust:check` gate agree on
#      --all-targets. They are NOT byte-for-byte identical, though: this
#      step adds --no-deps to keep the CI job scoped to the `gui-pro`
#      crate's own code, while `npm run rust:check` (gui-pro/package.json,
#      CLAUDE.md) runs WITHOUT --no-deps and so also lints every crate in
#      the dependency graph, including the path dependency
#      trusttunnel/settings (Cargo.toml). That is intentional, not a gap:
#      the local gate is the stricter, broader one — it is not meant to be
#      narrowed to match CI, only guaranteed to catch everything CI does.
#   2. cargo test --lib
#
# Runner choice: windows-latest is required, not preferred.
#   - `keyring 3.6` is enabled with `features = ["windows-native"]`
#     (Phase 16). On Linux, the same crate would pick a different
#     backend (Secret Service / D-Bus) and the SshKeyModal disable-PW
#     code path would compile against a different API surface —
#     defeating the point of CI as a production-mirror.
#   - `apply_win11_rounded_corners` and `tauri_build::WindowsAttributes`
#     (build.rs) are inside `#[cfg(windows)]` blocks — Linux runners
#     would silently skip them and never catch a regression.
#   - The bundled vcruntime + wintun DLL copy in build.rs is Windows-
#     only too.
#
# Cache: Swatinem/rust-cache@v2 keys on Cargo.lock + workspace root.
# Cold first run on Windows is 8-12 min; warm cache cuts it to ~2 min.
#
# Trigger scope: any `.rs` / `Cargo.toml` / `Cargo.lock` change anywhere
# in `gui-pro/src-tauri/` (the only Rust crate in scope per the
# 2026-05-23 user direction — gui-light is parked until its dedicated
# redesign milestone).

env:
  RUST_CHANNEL: stable

on:
  push:
    branches:
      # `**` not `*` — single-star does NOT match `/` in branch refs, so
      # any push to `release/*` or `claude/*` would silently skip the
      # gate. Existing workflows had the same latent bug; this one ships
      # with the fix from day one.
      - "**"
    paths:
      - "gui-pro/src-tauri/**/*.rs"
      - "gui-pro/src-tauri/Cargo.toml"
      - "gui-pro/src-tauri/Cargo.lock"
      - "gui-pro/src-tauri/build.rs"
      - "gui-pro/src-tauri/tauri.conf.json"
      # `Cargo.toml:70` depends on this crate BY PATH, so its absence is not a
      # missing feature — cargo cannot resolve the dependency graph at all and
      # the build dies before compiling a line. `master` was trimmed without it
      # on 2026-09-11 and stayed broken unnoticed, because the trim touched no
      # path listed here and every push after it changed only Markdown. The
      # first push that did touch `gui-pro/` turned this gate red immediately.
      - "trusttunnel/settings/**"
      - ".github/workflows/tauri-rust.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "gui-pro/src-tauri/**/*.rs"
      - "gui-pro/src-tauri/Cargo.toml"
      - "gui-pro/src-tauri/Cargo.lock"
      - "gui-pro/src-tauri/build.rs"
      - "gui-pro/src-tauri/tauri.conf.json"
      # `Cargo.toml:70` depends on this crate BY PATH, so its absence is not a
      # missing feature — cargo cannot resolve the dependency graph at all and
      # the build dies before compiling a line. `master` was trimmed without it
      # on 2026-09-11 and stayed broken unnoticed, because the trim touched no
      # path listed here and every push after it changed only Markdown. The
      # first push that did touch `gui-pro/` turned this gate red immediately.
      - "trusttunnel/settings/**"
      - ".github/workflows/tauri-rust.yml"
  workflow_dispatch:

jobs:
  rust-quality:
    runs-on: windows-latest
    if: "!startsWith(github.event.head_commit.message, 'skipci:')"
    defaults:
      run:
        working-directory: gui-pro/src-tauri
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_CHANNEL }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-pro/src-tauri
          # Keep the cache scoped to this workflow — sharing keys with
          # lint-rust.yml (C++ setup_wizard) would pollute both caches
          # with each other's artifacts and slow cold-start.
          shared-key: tauri-rust-gui-pro

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui-pro/package-lock.json

      - name: npm ci (gui-pro)
        working-directory: gui-pro
        run: npm ci --legacy-peer-deps

      - name: Build frontend (Vite -> gui-pro/dist)
        working-directory: gui-pro
        # tauri::generate_context!() at compile time validates the
        # `frontendDist` path declared in tauri.conf.json ("../dist").
        # Without the Vite build, clippy on the lib crate panics with
        # "frontendDist `../dist` doesn't exist". Vite production build
        # is ~3-5 s after the npm cache is warm.
        run: npm run build

      - name: Stub Tauri externalBin + resources
        shell: pwsh
        # build.rs calls `tauri_build::try_build(attrs)` which validates
        # that every path in tauri.conf.json `externalBin` and `resources`
        # actually exists on disk. These are .gitignored sidecar artifacts
        # (CLAUDE.md §Worktree Setup) that don't ship with the repo —
        # they are produced by the separate `TrustTunnel/TrustTunnel`
        # sidecar build. Clippy and `cargo test --lib` never execute
        # these binaries, so zero-byte stubs are sufficient to clear the
        # path-existence check. The real bundle still needs the real
        # binaries — this only unblocks lint + unit-test CI.
        run: |
          New-Item -ItemType File -Force -Path "trusttunnel_client-x86_64-pc-windows-msvc.exe" | Out-Null
          New-Item -ItemType File -Force -Path "wintun.dll" | Out-Null
          New-Item -ItemType File -Force -Path "vcruntime140.dll" | Out-Null
          New-Item -ItemType File -Force -Path "vcruntime140_1.dll" | Out-Null

      - name: Clippy (-D warnings)
        run: cargo clippy --no-deps --all-targets -- -D warnings

      - name: Cargo test --lib
        shell: pwsh
        # The GUI's Common Controls v6 manifest is linked to its binary target,
        # not to Cargo's library-test executable. Without it TaskDialogIndirect
        # can fail to load before the test harness starts. Only test binaries
        # receive this activation context; the production manifest is unchanged.
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'pro-library-test-artifacts.jsonl'
          cargo test --lib --no-run --message-format=json > $buildLog
          if ($LASTEXITCODE -ne 0) { throw 'Library-test compilation failed.' }
          $executables = @(Get-Content -LiteralPath $buildLog | ForEach-Object {
            $artifact = $_ | ConvertFrom-Json -AsHashtable
            if ($artifact.reason -eq 'compiler-artifact' -and $artifact.profile.test -and
                $artifact.executable -and ($artifact.target.kind -contains 'lib')) {
              $artifact.executable
            }
          })
          if ($executables.Count -eq 0) { throw 'No library-test executable was produced.' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'pro-library-tests.manifest'
          [xml]$productManifest = Get-Content -LiteralPath 'trusttunnel.exe.manifest' -Raw
          $dependency = $productManifest.SelectSingleNode(
            "//*[local-name()='dependency'][.//*[local-name()='assemblyIdentity' and @name='Microsoft.Windows.Common-Controls']]"
          )
          if (-not $dependency) { throw 'The GUI manifest has no Common Controls dependency.' }
          # Reuse the dependency without the production administrator requirements.
          [xml]$testManifest = '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0" />'
          $null = $testManifest.DocumentElement.AppendChild($testManifest.ImportNode($dependency, $true))
          $testManifest.Save($manifestPath)
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool was not found.' }
          foreach ($executable in $executables) {
            & $mt.FullName -nologo -manifest $manifestPath "-outputresource:$executable;#1"
            if ($LASTEXITCODE -ne 0) { throw 'Test activation-context setup failed.' }
            & $executable --quiet
            if ($LASTEXITCODE -ne 0) { throw 'Library tests failed.' }
          }
