[package]
name = "trusttunnel-light"
version = "2.7.0"
description = "TrustTunnel Light VPN Client"
authors = ["Alex Bond"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "trusttunnel_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-notification = "2"
reqwest = { version = "0.13.2", features = ["default-tls", "stream", "json"] }
tokio-stream = "0.1"
notify = { version = "7", features = ["macos_fsevent"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
trusttunnel-settings = { path = "../../trusttunnel/settings" }
futures-util = "0.3"
chrono = "0.4"
ipconfig = "0.3"
socket2 = { version = "0.5", features = ["all"] }

# Job Object FFI (D-06 / STATUS-04): сайдкар привязывается к Job Object с
# KILL_ON_JOB_CLOSE, чтобы ОС убивала его при смерти родителя (включая краш).
# Берём windows-sys (официальный MS crate, УЖЕ транзитивно в Cargo.lock — нулевая
# новая загрузка), а НЕ полный `windows` crate и НЕ `win32job` (он тянет
# `windows ^0.61`). JobObjects не используют HWND, так что правило avoid-windows
# здесь не применимо. Только нужные модули: JobObjects/Threading/Foundation.
# Зеркало решения Pro Plan 02-03.
[target.'cfg(windows)'.dependencies]
# Win32_Security needed for CreateJobObjectW's SECURITY_ATTRIBUTES parameter type
# (in Pro this feature is enabled transitively by another crate; Light's transitive
# set differs, so we enable it explicitly here).
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Dev-only tooling gate (T-14). Mirrors Pro: enables the F12 devtools AND the
# `open_log_window` command. A public/release build (`cargo build` without this
# feature) contains neither, so the dev log window provably cannot ship.
devtools = ["tauri/devtools"]
