[toolchain]
# Single source of truth for the Rust toolchain across both editions.
# Tracks `stable` — the toolchain the project has actually built on for months
# (gui-pro previously pinned "stable" here-shadowing an out-of-date 1.88 root +
# CI pin). Aligned UP to stable per owner decision 2026-06-22 so local, both
# editions, and CI all build on the same current compiler.
channel = "stable"
